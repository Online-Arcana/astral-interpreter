name: tmp-map-runv2
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-map-runv2.yml]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: grep -nE '^(interface|const|export const) ' src/llm/orchestrate/run-v2.ts
