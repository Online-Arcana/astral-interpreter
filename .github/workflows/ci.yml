name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm run vendor:build
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Guard browser dependency boundary
        run: |
          if grep -R -n -F 'from "astral-core"' src dist --include='*.ts' --include='*.js' --include='*.d.ts'; then
            echo 'Bare astral-core import is forbidden'
            exit 1
          fi
          if grep -R -n -F "from 'astral-core'" src dist --include='*.ts' --include='*.js' --include='*.d.ts'; then
            echo 'Bare astral-core import is forbidden'
            exit 1
          fi
          ! grep -E 'node:(fs|path|url)' dist/web.js
          grep -R -n -F 'astral-core/web' dist --include='*.js' | head -20
      # This job also validates the regenerated committed package state on split-modules.
