name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm run vendor:build
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Guard browser dependency boundary
        run: |
          ! grep -F 'from "astral-core"' dist/web.js
          ! grep -E 'node:(fs|path|url)' dist/web.js
          grep -F 'from "astral-core/web"' dist/web.js
      # This job also validates the regenerated committed package state on split-modules.
