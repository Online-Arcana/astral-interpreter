name: tmp-map-runv2-uses
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-map-runv2-uses.yml]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sed -n '552,940p' src/llm/orchestrate/run-v2.ts | grep -nE '\b(executeUnit|restoreStaged|restore|emptyRecovery|recoveredPlans|without|deterministicUnit|emergencyRun|activeCopy|localConversationId|paidAttempts|count)\b'
