name: tmp-web-ref

on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-web-ref.yml]

permissions:
  contents: write

jobs:
  export-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Export browser reference validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/web.ts')
          s=p.read_text()
          line='export * from "./ref/resolve.js";\n'
          if line not in s:
              s += line
          p.write_text(s)
          PY
          npm run vendor:build
          npm ci
          npm run check
          npm test
          npm run build
          node --input-type=module - <<'NODE'
          const web = await import('./dist/web.js');
          if (typeof web.refsValid !== 'function' || typeof web.resolveRef !== 'function') {
            throw new Error('reference validation exports missing from interpreter web entry');
          }
          NODE
          git restore --source=HEAD --staged --worktree .github/workflows || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/web.ts
          git add -f dist/web.*
          git commit -m "Export reference validation from interpreter web entry"
          git pull --rebase origin agent/split-modules
          git push origin HEAD:agent/split-modules
