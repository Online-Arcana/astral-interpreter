# Revalidate after orchestration compatibility repair.
name: tmp-pin-core-package
on:
  push:
    branches: [agent/split-modules]
    paths:
      - .github/workflows/tmp-pin-core-package.yml
      - vendor/astral-core
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate pinned core and interpreter packages
        run: |
          set -euo pipefail
          npm run vendor:build
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check
          npm run build
          npm test

          rm -rf /tmp/astral-interpreter-consumer
          mkdir -p /tmp/astral-interpreter-consumer
          CORE_PACK_JSON="$(npm --prefix vendor/astral-core pack --json --pack-destination /tmp/astral-interpreter-consumer)"
          CORE_PACK_NAME="$(printf '%s' "$CORE_PACK_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')"
          INTERPRETER_PACK_JSON="$(npm pack --json --pack-destination /tmp/astral-interpreter-consumer)"
          INTERPRETER_PACK_NAME="$(printf '%s' "$INTERPRETER_PACK_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')"

          tar -tzf "/tmp/astral-interpreter-consumer/$INTERPRETER_PACK_NAME" > /tmp/astral-interpreter-package.txt
          if grep -Eq '^package/(vendor|node_modules)/' /tmp/astral-interpreter-package.txt; then
            echo 'dependency source leaked into packed interpreter' >&2
            exit 1
          fi
          grep -q '^package/dist/index.js$' /tmp/astral-interpreter-package.txt
          grep -q '^package/src/interpretation/corpus/data/xml/' /tmp/astral-interpreter-package.txt

          cd /tmp/astral-interpreter-consumer
          printf '{"name":"interpreter-consumer","private":true,"type":"module"}\n' > package.json
          npm install "./$CORE_PACK_NAME" "./$INTERPRETER_PACK_NAME" --ignore-scripts >/dev/null
          node --input-type=module <<'NODE'
          import { randomChart } from 'astral-core';
          import { compileReviewedCorpus, prepare, reviewedCorpusOrigin } from 'astral-interpreter';
          let state = 0x1a2b3c4d;
          const rng = () => {
            state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
            return state / 0x1_0000_0000;
          };
          const calculation = await randomChart({ zodiac: 'tropical', ayanamsha: 'lahiri' }, rng);
          const prepared = prepare(calculation, {
            name: 'Package Consumer',
            language: 'en-GB',
            gender: 'non-binary',
          });
          if (prepared.provenance.calculationFingerprint !== calculation.provenance.calculationFingerprint) {
            throw new Error('calculation fingerprint changed across interpreter boundary');
          }
          if (prepared.interpretationPlan.units.length === 0) throw new Error('interpretation plan is empty');
          if (reviewedCorpusOrigin !== 'xml') throw new Error('reviewed corpus origin changed');
          const corpus = compileReviewedCorpus(true);
          if (Object.keys(corpus.atoms).length === 0 || Object.keys(corpus.claims).length === 0) {
            throw new Error('reviewed corpus is empty');
          }
          console.log('standalone astral-interpreter package passed');
          NODE

          cd "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git add -f dist
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate astral-interpreter package state"
            git fetch origin agent/split-modules
            git rebase origin/agent/split-modules
            git push origin HEAD:agent/split-modules
          fi
