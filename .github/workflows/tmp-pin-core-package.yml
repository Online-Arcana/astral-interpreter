name: tmp-pin-core-package
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-pin-core-package.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Pin core and validate interpreter package
        run: |
          set -euo pipefail
          git -C vendor/astral-core fetch origin b69341e4eda822d22a07162bd98d2d498375ae59
          git -C vendor/astral-core checkout --detach b69341e4eda822d22a07162bd98d2d498375ae59
          git -C vendor/astral-core submodule update --init --recursive
          npm run vendor:build
          npm ci
          npm run check
          npm run build
          npm test
          rm -rf /tmp/astral-interpreter-consumer
          mkdir -p /tmp/astral-interpreter-consumer
          npm pack --pack-destination /tmp/astral-interpreter-consumer
          tar -tzf /tmp/astral-interpreter-consumer/astral-interpreter-0.1.0.tgz > /tmp/astral-interpreter-package.txt
          grep -q 'package/node_modules/astral-core/package.json' /tmp/astral-interpreter-package.txt
          grep -q 'package/node_modules/openai-schema/package.json' /tmp/astral-interpreter-package.txt
          if grep -q '^package/vendor/' /tmp/astral-interpreter-package.txt; then
            echo 'vendor source leaked into packed interpreter' >&2
            exit 1
          fi
          cd /tmp/astral-interpreter-consumer
          printf '{"name":"interpreter-consumer","private":true,"type":"module"}\n' > package.json
          npm install ./astral-interpreter-0.1.0.tgz --ignore-scripts
          node -e 'import("astral-interpreter").then(m => { if (typeof m.runInterpretationPlan !== "function") throw new Error("runInterpretationPlan export missing"); console.log("bundled astral-interpreter import passed") })'
          cd "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/astral-core
          git commit -m "Pin astral-core" || true
          git push origin HEAD:agent/split-modules
