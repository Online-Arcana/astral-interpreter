name: tmp-browser-import-boundary

on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-browser-import-boundary.yml]

permissions:
  contents: write

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Rebuild browser-safe interpreter package
        run: |
          set -euo pipefail
          CORE=05e74423b62da0ad9dc87582494a4304e33fe725
          git -C vendor/astral-core fetch origin "$CORE"
          git -C vendor/astral-core checkout "$CORE"
          git add vendor/astral-core

          npm run vendor:build
          npm ci
          npm run check
          npm run build
          npm test

          ! grep -F 'from "astral-core"' dist/web.js
          ! grep -E 'node:(fs|path|url)' dist/web.js
          grep -F 'from "astral-core/web"' dist/web.js

          git restore --source=HEAD --staged --worktree .github/workflows || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/astral-core
          git add -f dist
          git commit -m "Use browser-safe core from interpreter web bundle"
          git pull --rebase origin agent/split-modules
          git push origin HEAD:agent/split-modules
