name: tmp-browser-import-boundary

on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-browser-import-boundary.yml]

permissions:
  contents: write

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Rebuild browser-safe interpreter package
        run: |
          set -euo pipefail
          npm run vendor:build
          npm ci
          npm run check
          npm run build
          npm test

          ! grep -F 'from "astral-core"' dist/web.js
          ! grep -E 'node:(fs|path|url)' dist/web.js
          grep -F 'from "astral-core/web"' dist/web.js

          git restore --source=HEAD --staged --worktree .github/workflows || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f dist
          if git diff --cached --quiet; then
            echo "Interpreter package state already current"
          else
            git commit -m "Regenerate browser-safe interpreter bundle"
            git pull --rebase origin agent/split-modules
            git push origin HEAD:agent/split-modules
          fi
